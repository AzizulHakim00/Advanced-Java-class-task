<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Print Queue</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f7fb;color:#172033}.top{background:#0f3d66;color:#fff;padding:16px 7%;display:flex;justify-content:space-between}.top a{color:#fff;text-decoration:none;margin-left:12px}.page{width:min(1250px,95%);margin:28px auto}.box{background:#fff;border:1px solid #dde5ef;border-radius:15px;padding:22px}.head{display:flex;justify-content:space-between;align-items:center}.filter{display:grid;grid-template-columns:2fr 1fr 1fr auto auto;gap:10px;margin:18px 0;padding:14px;background:#eef6fa;border-radius:10px}input,select{padding:10px;border:1px solid #b9c6d4;border-radius:7px}.btn{display:inline-block;text-decoration:none;border:0;padding:8px 11px;border-radius:7px;font-weight:700;font-size:13px}.primary{background:#0f6f8c;color:#fff}.green{background:#18864b;color:#fff}.amber{background:#e69a00;color:#fff}.danger{background:#c83939;color:#fff}.muted{background:#68768b;color:#fff}.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:11px 9px;border-bottom:1px solid #e4eaf1;text-align:left}th{background:#eef6fa;color:#0f3d66}.badge{padding:5px 8px;border-radius:999px;font-size:12px;font-weight:800}.status-waiting{background:#fff3cd;color:#7a5600}.status-printing{background:#dbeafe;color:#1d4ed8}.status-ready{background:#d1fae5;color:#065f46}.status-collected{background:#dcfce7;color:#166534}.status-cancelled{background:#fee2e2;color:#991b1b}.actions{display:flex;gap:5px;flex-wrap:wrap}@media(max-width:850px){.filter{grid-template-columns:1fr 1fr}.head,.top{flex-direction:column;align-items:flex-start;gap:10px}}</style></head><body><header class="top"><strong>PrintPulse · Southeast University</strong><nav><a th:href="@{/printpulse/dashboard}">Dashboard</a><a th:href="@{/printpulse/requests/add}">New Request</a><a th:href="@{/printpulse/history}">History</a></nav></header><main class="page"><section class="box"><div class="head"><div><h1>Campus Print Queue</h1><p>Manage print jobs and pickup status</p></div><a class="btn primary" th:href="@{/printpulse/requests/add}">+ New Request</a></div><form class="filter" method="get" th:action="@{/printpulse/requests}"><input name="keyword" th:value="${keyword}" placeholder="ID, student or document"><select name="status"><option value="">All Statuses</option><option th:each="x:${statuses}" th:value="${x}" th:text="${x}" th:selected="${x==selectedStatus}"></option></select><select name="printType"><option value="">All Print Types</option><option th:each="x:${printTypes}" th:value="${x}" th:text="${x}" th:selected="${x==selectedPrintType}"></option></select><button class="btn primary">Search</button><a class="btn muted" th:href="@{/printpulse/requests}">Clear</a></form><div class="wrap"><table><thead><tr><th>Queue</th><th>Student</th><th>Document</th><th>Pages</th><th>Type</th><th>Paper</th><th>Cost</th><th>Status</th><th>Action</th></tr></thead><tbody><tr th:each="item:${requests}"><td th:text="${'#'+item.requestId}">#1001</td><td><strong th:text="${item.studentName}">Name</strong><br><small th:text="${item.studentId}">ID</small></td><td th:text="${item.documentName}">Doc</td><td th:text="${item.totalPrintedPages}">10</td><td th:text="${item.printType}">Color</td><td th:text="${item.paperSize}">A4</td><td th:text="${'৳'+#numbers.formatDecimal(item.totalCost,1,2)}">৳0</td><td><span class="badge" th:classappend="${' '+item.statusClass}" th:text="${item.status}">Waiting</span></td><td><div class="actions"><a class="btn primary" th:href="@{/printpulse/requests/details/{id}(id=${item.requestId})}">View</a><a class="btn muted" th:href="@{/printpulse/requests/edit/{id}(id=${item.requestId})}">Edit</a><a class="btn amber" th:if="${item.status=='Waiting'}" th:href="@{/printpulse/requests/status/{id}(id=${item.requestId},value='Printing')}">Print</a><a class="btn green" th:if="${item.status=='Printing'}" th:href="@{/printpulse/requests/status/{id}(id=${item.requestId},value='Ready')}">Ready</a><a class="btn green" th:if="${item.status=='Ready'}" th:href="@{/printpulse/requests/status/{id}(id=${item.requestId},value='Collected')}">Collect</a><a class="btn danger" th:href="@{/printpulse/requests/delete/{id}(id=${item.requestId})}" onclick="return confirm('Delete this request?')">Delete</a></div></td></tr><tr th:if="${requests.isEmpty()}"><td colspan="9" style="text-align:center;padding:30px">No matching print requests found.</td></tr></tbody></table></div></section></main></body></html>
