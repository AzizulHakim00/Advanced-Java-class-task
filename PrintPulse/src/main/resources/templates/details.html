<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Request Details</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f7fb;color:#172033}.top{background:#0f3d66;color:#fff;padding:16px 7%;display:flex;justify-content:space-between}.top a{color:#fff;text-decoration:none;margin-left:12px}.page{width:min(850px,92%);margin:28px auto}.ticket{background:#fff;border:1px solid #dde5ef;border-radius:16px;padding:28px}.head{display:flex;justify-content:space-between}.queue{font-size:34px;font-weight:900;color:#0f6f8c}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.item{padding:14px;background:#eef6fa;border-radius:10px}.item small{color:#68768b}.item strong{display:block;margin-top:4px}.total{margin-top:20px;padding:20px;background:#0f3d66;color:#fff;border-radius:12px;display:flex;justify-content:space-between;font-size:22px}.btn{display:inline-block;padding:10px 14px;border-radius:8px;text-decoration:none;font-weight:700;background:#0f6f8c;color:#fff}.muted{background:#68768b}@media(max-width:600px){.grid{grid-template-columns:1fr}.head{flex-direction:column}}</style></head><body><header class="top"><strong>PrintPulse · Southeast University</strong><nav><a th:href="@{/printpulse/dashboard}">Dashboard</a><a th:href="@{/printpulse/requests}">Queue</a></nav></header><main class="page"><section class="ticket"><div class="head"><div><h1>Print Request Details</h1><p>Southeast University Campus Print Service</p></div><div class="queue" th:text="${'#'+printRequest.requestId}">#1001</div></div><div class="grid"><div class="item"><small>Student</small><strong th:text="${printRequest.studentName}">Name</strong><span th:text="${printRequest.studentId}">ID</span></div><div class="item"><small>Document</small><strong th:text="${printRequest.documentName}">Document</strong><span th:text="${printRequest.requestDate}">Date</span></div><div class="item"><small>Print Setup</small><strong th:text="${printRequest.printType+' • '+printRequest.paperSize}">Type</strong><span th:text="${printRequest.totalPages+' pages × '+printRequest.copies+' copies'}">Pages</span></div><div class="item"><small>Status</small><strong th:text="${printRequest.status}">Waiting</strong><span th:text="${printRequest.collectedDate!=null?'Collected: '+printRequest.collectedDate:'Not collected yet'}"></span></div><div class="item" style="grid-column:1/-1"><small>Notes</small><strong th:text="${#strings.isEmpty(printRequest.notes)?'No special notes':printRequest.notes}">Notes</strong></div></div><div class="total"><span>Total Cost</span><strong th:text="${'৳'+#numbers.formatDecimal(printRequest.totalCost,1,2)}">৳0</strong></div><p><a class="btn" th:href="@{/printpulse/requests/edit/{id}(id=${printRequest.requestId})}">Edit Request</a> <a class="btn muted" th:href="@{/printpulse/requests}">Back to Queue</a></p></section></main></body></html>
