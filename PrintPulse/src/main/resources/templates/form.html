<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${name}">Print Request</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f7fb;color:#172033}.top{background:#0f3d66;color:#fff;padding:16px 7%;display:flex;justify-content:space-between}.top a{color:#fff;text-decoration:none;margin-left:12px}.page{width:min(900px,92%);margin:28px auto}.box{background:#fff;border-radius:16px;padding:28px;border:1px solid #dde5ef}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.full{grid-column:1/-1}label{display:block;font-weight:700;margin-bottom:6px}input,select,textarea{width:100%;padding:11px;border:1px solid #b9c6d4;border-radius:8px}.error{color:#c62828;font-size:13px}.btn{border:0;padding:11px 16px;border-radius:8px;font-weight:700;text-decoration:none;cursor:pointer}.save{background:#0f6f8c;color:#fff}.back{background:#68768b;color:#fff}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><header class="top"><strong>PrintPulse · Southeast University</strong><nav><a th:href="@{/printpulse/dashboard}">Dashboard</a><a th:href="@{/printpulse/requests}">Queue</a></nav></header><main class="page"><section class="box"><h1 th:text="${name}">New Print Request</h1><form method="post" th:action="${editMode} ? @{/printpulse/requests/edit/{id}(id=${originalId})} : @{/printpulse/requests/add}" th:object="${printRequest}"><div class="grid"><div><label>Request ID</label><input type="number" th:field="*{requestId}" th:readonly="${editMode}"><span class="error" th:errors="*{requestId}"></span></div><div><label>Student ID</label><input th:field="*{studentId}"><span class="error" th:errors="*{studentId}"></span></div><div><label>Student Name</label><input th:field="*{studentName}"><span class="error" th:errors="*{studentName}"></span></div><div><label>Document Name</label><input th:field="*{documentName}"><span class="error" th:errors="*{documentName}"></span></div><div><label>Total Pages</label><input type="number" th:field="*{totalPages}"><span class="error" th:errors="*{totalPages}"></span></div><div><label>Copies</label><input type="number" th:field="*{copies}"><span class="error" th:errors="*{copies}"></span></div><div><label>Print Type</label><select th:field="*{printType}"><option th:each="x:${printTypes}" th:value="${x}" th:text="${x}"></option></select></div><div><label>Paper Size</label><select th:field="*{paperSize}"><option th:each="x:${paperSizes}" th:value="${x}" th:text="${x}"></option></select></div><div><label>Status</label><select th:field="*{status}"><option th:each="x:${statuses}" th:value="${x}" th:text="${x}"></option></select></div><div><label>Request Date</label><input type="date" th:field="*{requestDate}"></div><div class="full"><label>Notes</label><textarea rows="4" th:field="*{notes}"></textarea></div></div><p><button class="btn save" type="submit" th:text="${editMode} ? 'Update Request' : 'Save Request'">Save</button> <a class="btn back" th:href="@{/printpulse/requests}">Back</a></p></form></section></main></body></html>
