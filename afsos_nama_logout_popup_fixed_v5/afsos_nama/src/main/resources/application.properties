spring.application.name=afsos_nama

# Vercel automatically provides PORT
server.port=${PORT:8080}
server.address=0.0.0.0

# Cloud database values; local values are used when running on your computer
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/afsos_nama}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.data.jpa.repositories.bootstrap-mode=lazy

#8w5CpxcJFkEIrOT9

# Authentication session: browser-session cookie only (no persistent login)
server.servlet.session.cookie.max-age=-1s
server.servlet.session.persistent=false
server.servlet.session.cookie.http-only=true
