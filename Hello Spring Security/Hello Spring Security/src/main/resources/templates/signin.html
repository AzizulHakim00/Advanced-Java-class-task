<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Sign In</title>
</head>

<body>

<h2>Sign In</h2>

<form th:action="@{/signin}" method="post">

    <input type="email"
           name="email"
           placeholder="Email">
    <br><br>

    <input type="password"
           name="password"
           placeholder="Password">
    <br><br>

    <button type="submit">
        Sign In
    </button>

</form>

<br>

<a th:href="@{/signup}">
    Create an account
</a>

</body>
</html>
