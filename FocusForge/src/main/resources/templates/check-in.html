<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Check-in</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><nav class="navbar"><div class="brand">🎓 Focus<span>Forge</span></div><div class="nav-links"><a th:href="@{/focusforge/dashboard}">Dashboard</a><a th:href="@{/focusforge/tasks}">Tasks</a><a th:href="@{/focusforge/check-in}">Check-in</a><a th:href="@{/focusforge/history}">History</a></div><div class="tagline">Focus Smarter, Achieve More!</div></nav><main class="page"><div class="page-title"><div><h1>Study Check-in</h1><p class="muted">Tell us about your current state to get the best recommendation.</p></div></div><div class="form-card"><form method="post" th:action="@{/focusforge/recommend}" th:object="${checkIn}"><div class="check-grid"><div class="check-box"><div class="check-icon">🕒</div><div class="field"><label>Available Time</label><select th:field="*{availableMinutes}"><option value="30">30 minutes</option><option value="45">45 minutes</option><option value="60">60 minutes</option><option value="90">90 minutes</option><option value="120">120 minutes</option><option value="180">180 minutes</option></select><span class="error" th:errors="*{availableMinutes}"></span></div></div><div class="check-box"><div class="check-icon">⚡</div><div class="field"><label>Energy Level</label><select th:field="*{energyLevel}"><option value="Low">Low</option><option value="Medium">Medium</option><option value="High">High</option></select><span class="error" th:errors="*{energyLevel}"></span></div></div><div class="check-box"><div class="check-icon">🙂</div><div class="field"><label>Current Mood</label><select th:field="*{mood}"><option value="Focused">Focused</option><option value="Normal">Normal</option><option value="Tired">Tired</option><option value="Stressed">Stressed</option></select><span class="error" th:errors="*{mood}"></span></div></div></div><div class="info-box"><b>Why do we need this?</b><br><span class="small">Your time, energy and mood help us recommend the most suitable task for you right now.</span></div><div class="text-center"><button class="btn btn-purple" type="submit">Find Best Task</button></div></form></div></main></body></html>
