<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Add Study Resource</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main class="page"><div class="page-title"><h1>Add Study Resource</h1></div><section class="form-card"><form th:action="@{/resource/add}" th:object="${studyResource}" method="post"><div class="form-grid"><div class="field"><label>Title</label><input th:field="*{title}"><span class="error" th:errors="*{title}"></span></div><div class="field"><label>Course Name</label><input th:field="*{courseName}"><span class="error" th:errors="*{courseName}"></span></div><div class="field"><label>Type</label><select th:field="*{resourceType}"><option>Video</option><option>Website</option><option>PDF</option><option>Other</option></select><span class="error" th:errors="*{resourceType}"></span></div><div class="field"><label>Resource Link</label><input th:field="*{resourceLink}" placeholder="https://..."><span class="error" th:errors="*{resourceLink}"></span></div></div><button class="btn btn-green" type="submit">Save Resource</button> <a class="btn btn-gray" th:href="@{/resource/list}">Back</a></form></section></main></body></html>
