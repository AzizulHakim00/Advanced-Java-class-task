<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Exam Schedule</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main class="page"><div class="toolbar"><div><h1>Exam Schedule</h1></div><div><a class="btn btn-purple" th:href="@{/exam/add}">Add Exam</a> <a class="btn btn-gray" th:href="@{/focusforge/dashboard}">Dashboard</a></div></div><section class="table-card"><div class="empty" th:if="${exams.isEmpty()}">No exams added yet.</div><div class="table-wrapper" th:unless="${exams.isEmpty()}"><table><thead><tr><th>Course</th><th>Exam Type</th><th>Date</th><th>Room</th><th>Action</th></tr></thead><tbody><tr th:each="exam : ${exams}"><td th:text="${exam.courseName}"></td><td th:text="${exam.examType}"></td><td th:text="${exam.examDate}"></td><td th:text="${exam.room}"></td><td><a class="btn btn-red" th:href="@{/exam/delete(id=${exam.id})}">Delete</a></td></tr></tbody></table></div></section></main></body></html>
