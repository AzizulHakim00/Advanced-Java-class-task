<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Focus Sessions</title><link rel="stylesheet" th:href="@{/css/style.css}"><link rel="stylesheet" th:href="@{/css/extra.css}"></head>
<body>
<nav class="navbar"><div class="brand">🎓 Focus<span>Forge</span></div><div class="nav-links"><a th:href="@{/focusforge/dashboard}">Dashboard</a><a th:href="@{/focusforge/tasks}">Tasks</a><a th:href="@{/focusforge/sessions}">Sessions</a><a th:href="@{/focusforge/notes}">Notes</a><a th:href="@{/focusforge/history}">History</a></div><form th:action="@{/logout}" method="post"><button class="btn btn-gray" type="submit">Logout</button></form></nav>
<main class="page">
<div class="page-title"><div><h1>Focus Session Tracker</h1><p class="muted">Log focused study time and build a consistent routine.</p></div></div>
<section class="history-stats"><div class="history-card"><span class="muted small">Today</span><strong th:text="${todayMinutes + ' min'}">0 min</strong></div><div class="history-card"><span class="muted small">All Focus Time</span><strong th:text="${totalMinutes + ' min'}">0 min</strong></div><div class="history-card"><span class="muted small">Sessions</span><strong th:text="${sessions.size()}">0</strong></div></section>
<section class="form-card section-gap"><h3>Log a Focus Session</h3><form th:action="@{/focusforge/sessions}" th:object="${focusSession}" method="post"><div class="form-grid"><div class="field"><label>Subject / Task</label><input th:field="*{subject}" placeholder="e.g. Java Authentication"><span class="error" th:errors="*{subject}"></span></div><div class="field"><label>Duration (minutes)</label><input type="number" th:field="*{durationMinutes}" min="5" max="600"><span class="error" th:errors="*{durationMinutes}"></span></div><div class="field"><label>Date</label><input type="date" th:field="*{sessionDate}"><span class="error" th:errors="*{sessionDate}"></span></div><div class="field full"><label>Notes</label><textarea th:field="*{notes}" rows="3" placeholder="What did you complete?"></textarea><span class="error" th:errors="*{notes}"></span></div></div><button class="btn btn-green" type="submit">Save Session</button></form></section>
<section class="table-card section-gap"><h3>Session History</h3><div class="empty" th:if="${sessions.isEmpty()}">No focus sessions logged yet.</div><div class="table-wrapper" th:unless="${sessions.isEmpty()}"><table><thead><tr><th>Date</th><th>Subject</th><th>Duration</th><th>Notes</th><th>Action</th></tr></thead><tbody><tr th:each="session : ${sessions}"><td th:text="${session.sessionDate}"></td><td><b th:text="${session.subject}"></b></td><td th:text="${session.durationMinutes + ' min'}"></td><td th:text="${session.notes}"></td><td><a class="btn btn-red" th:href="@{/focusforge/sessions/delete/{id}(id=${session.id})}" onclick="return confirm('Delete this session?')">Delete</a></td></tr></tbody></table></div></section>
</main></body></html>
