<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Study Goals</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main class="page"><div class="toolbar"><div><h1>Study Goals</h1></div><div><a class="btn btn-blue" th:href="@{/goal/add}">Add Goal</a> <a class="btn btn-gray" th:href="@{/focusforge/dashboard}">Dashboard</a></div></div><section class="table-card"><div class="empty" th:if="${goals.isEmpty()}">No study goals added yet.</div><div class="table-wrapper" th:unless="${goals.isEmpty()}"><table><thead><tr><th>Goal</th><th>Target Date</th><th>Status</th><th>Description</th><th>Action</th></tr></thead><tbody><tr th:each="goal : ${goals}"><td th:text="${goal.title}"></td><td th:text="${goal.targetDate}"></td><td th:text="${goal.status}"></td><td th:text="${goal.description}"></td><td><a class="btn btn-red" th:href="@{/goal/delete(id=${goal.id})}">Delete</a></td></tr></tbody></table></div></section></main></body></html>
