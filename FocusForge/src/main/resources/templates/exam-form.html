<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Add Exam</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main class="page"><div class="page-title"><h1>Add Exam Schedule</h1></div><section class="form-card"><form th:action="@{/exam/add}" th:object="${examSchedule}" method="post"><div class="form-grid"><div class="field"><label>Course Name</label><input th:field="*{courseName}"><span class="error" th:errors="*{courseName}"></span></div><div class="field"><label>Exam Type</label><select th:field="*{examType}"><option>Quiz</option><option>Midterm</option><option>Final</option><option>Viva</option></select><span class="error" th:errors="*{examType}"></span></div><div class="field"><label>Exam Date</label><input type="date" th:field="*{examDate}"><span class="error" th:errors="*{examDate}"></span></div><div class="field"><label>Room</label><input th:field="*{room}"></div></div><button class="btn btn-purple" type="submit">Save Exam</button> <a class="btn btn-gray" th:href="@{/exam/list}">Back</a></form></section></main></body></html>
