<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Add Study Goal</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main class="page"><div class="page-title"><h1>Add Study Goal</h1></div><section class="form-card"><form th:action="@{/goal/add}" th:object="${studyGoal}" method="post"><div class="form-grid"><div class="field"><label>Goal Title</label><input th:field="*{title}"><span class="error" th:errors="*{title}"></span></div><div class="field"><label>Target Date</label><input type="date" th:field="*{targetDate}"><span class="error" th:errors="*{targetDate}"></span></div><div class="field"><label>Status</label><select th:field="*{status}"><option>In Progress</option><option>Completed</option></select><span class="error" th:errors="*{status}"></span></div><div class="field full"><label>Description</label><textarea th:field="*{description}" rows="4"></textarea></div></div><button class="btn btn-blue" type="submit">Save Goal</button> <a class="btn btn-gray" th:href="@{/goal/list}">Back</a></form></section></main></body></html>
