<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Study Resources</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main class="page"><div class="toolbar"><div><h1>Study Resources</h1></div><div><a class="btn btn-green" th:href="@{/resource/add}">Add Resource</a> <a class="btn btn-gray" th:href="@{/focusforge/dashboard}">Dashboard</a></div></div><section class="table-card"><div class="empty" th:if="${resources.isEmpty()}">No study resources added yet.</div><div class="table-wrapper" th:unless="${resources.isEmpty()}"><table><thead><tr><th>Title</th><th>Course</th><th>Type</th><th>Link</th><th>Action</th></tr></thead><tbody><tr th:each="resource : ${resources}"><td th:text="${resource.title}"></td><td th:text="${resource.courseName}"></td><td th:text="${resource.resourceType}"></td><td><a th:href="${resource.resourceLink}" target="_blank">Open</a></td><td><a class="btn btn-red" th:href="@{/resource/delete(id=${resource.id})}">Delete</a></td></tr></tbody></table></div></section></main></body></html>
