<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Study Notes</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><main class="page"><div class="toolbar"><h1>Study Notes</h1><a class="btn btn-blue" th:href="@{/note/add}">Add Note</a></div><div class="table-card"><table><thead><tr><th>ID</th><th>Title</th><th>Course</th><th>Note</th><th>Action</th></tr></thead><tbody><tr th:each="note : ${notes}"><td th:text="${note.id}"></td><td th:text="${note.title}"></td><td th:text="${note.course}"></td><td th:text="${note.note}"></td><td><a class="btn btn-red" th:href="@{/note/delete(id=${note.id})}">Delete</a></td></tr></tbody></table></div><br><a class="btn btn-light" th:href="@{/focusforge/dashboard}">Dashboard</a></main></body>
</html>
