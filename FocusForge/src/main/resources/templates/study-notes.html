<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Notes</title><link rel="stylesheet" th:href="@{/css/style.css}"><link rel="stylesheet" th:href="@{/css/extra.css}"></head>
<body>
<nav class="navbar"><div class="brand">🎓 Focus<span>Forge</span></div><div class="nav-links"><a th:href="@{/focusforge/dashboard}">Dashboard</a><a th:href="@{/focusforge/tasks}">Tasks</a><a th:href="@{/focusforge/sessions}">Sessions</a><a th:href="@{/focusforge/notes}">Notes</a><a th:href="@{/focusforge/history}">History</a></div><form th:action="@{/logout}" method="post"><button class="btn btn-gray" type="submit">Logout</button></form></nav>
<main class="page">
<div class="page-title"><div><h1>Study Notes</h1><p class="muted">Keep short course notes beside your study tasks.</p></div></div>
<section class="form-card"><h3>Add a Note</h3><form th:action="@{/focusforge/notes}" th:object="${studyNote}" method="post"><div class="form-grid"><div class="field"><label>Title</label><input th:field="*{title}" placeholder="e.g. Spring Security Flow"><span class="error" th:errors="*{title}"></span></div><div class="field"><label>Course</label><input th:field="*{courseName}" placeholder="e.g. Advanced Java"><span class="error" th:errors="*{courseName}"></span></div><div class="field full"><label>Note</label><textarea th:field="*{content}" rows="5" placeholder="Write the important points here..."></textarea><span class="error" th:errors="*{content}"></span></div></div><button class="btn btn-purple" type="submit">Save Note</button></form></section>
<section class="notes-grid section-gap"><article class="note-card" th:each="note : ${notes}"><div class="toolbar"><div><h3 th:text="${note.title}">Title</h3><span class="badge badge-upcoming" th:if="${note.courseName != null and !note.courseName.isBlank()}" th:text="${note.courseName}"></span></div><a class="btn btn-red" th:href="@{/focusforge/notes/delete/{id}(id=${note.id})}" onclick="return confirm('Delete this note?')">Delete</a></div><p class="note-content" th:text="${note.content}"></p><p class="muted small" th:text="${'Saved ' + #temporals.format(note.updatedAt, 'dd MMM yyyy, hh:mm a')}"></p></article><div class="empty" th:if="${notes.isEmpty()}">No notes yet. Add your first study note above.</div></section>
</main></body></html>
