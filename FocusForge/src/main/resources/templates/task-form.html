<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${name}">Task Form</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><nav class="navbar"><div class="brand">🎓 Focus<span>Forge</span></div><div class="nav-links"><a th:href="@{/focusforge/dashboard}">Dashboard</a><a th:href="@{/focusforge/tasks}">Tasks</a><a th:href="@{/focusforge/check-in}">Check-in</a><a th:href="@{/focusforge/history}">History</a></div><div class="tagline">Focus Smarter, Achieve More!</div></nav><main class="page"><div class="page-title"><div><h1 th:text="${name}">Add New Study Task</h1><p class="muted">Fill in the details to add or update a study task.</p></div></div><div class="form-card"><form method="post" th:action="${editMode} ? @{/focusforge/tasks/edit/{id}(id=${originalTaskId})} : @{/focusforge/tasks/add}" th:object="${task}"><div class="form-grid"><div class="field"><label>Task ID</label><input type="number" th:field="*{taskId}" th:readonly="${editMode}" placeholder="101"><span class="error" th:errors="*{taskId}"></span></div><div class="field"><label>Task Name</label><input type="text" th:field="*{taskName}" placeholder="Complete Machine Learning Assignment"><span class="error" th:errors="*{taskName}"></span></div><div class="field"><label>Course Name</label><input type="text" th:field="*{courseName}" placeholder="Machine Learning (CSE-410)"><span class="error" th:errors="*{courseName}"></span></div><div class="field"><label>Difficulty</label><select th:field="*{difficulty}"><option value="">Select difficulty</option><option th:each="item : ${difficulties}" th:value="${item}" th:text="${item}"></option></select><span class="error" th:errors="*{difficulty}"></span></div><div class="field"><label>Deadline</label><input type="date" th:field="*{deadline}"><span class="error" th:errors="*{deadline}"></span></div><div class="field"><label>Importance</label><select th:field="*{importance}"><option value="">Select importance</option><option th:each="item : ${importanceLevels}" th:value="${item}" th:text="${item}"></option></select><span class="error" th:errors="*{importance}"></span></div><div class="field"><label>Estimated Minutes</label><input type="number" th:field="*{estimatedMinutes}" placeholder="120"><span class="error" th:errors="*{estimatedMinutes}"></span></div><div class="field"><label>Status</label><select th:field="*{status}"><option th:each="item : ${statuses}" th:value="${item}" th:text="${item}"></option></select><span class="error" th:errors="*{status}"></span></div><div class="field full"><label>Description (Optional)</label><textarea rows="4" th:field="*{description}" placeholder="Write a short task description"></textarea><span class="error" th:errors="*{description}"></span></div></div><div class="text-center section-gap"><button class="btn btn-green" type="submit" th:text="${editMode} ? 'Update Task' : 'Save Task'">Save Task</button> <a class="btn btn-light" th:href="@{/focusforge/tasks}">Cancel</a></div></form></div></main></body></html>
