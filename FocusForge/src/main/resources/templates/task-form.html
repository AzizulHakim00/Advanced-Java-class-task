<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${name}">Task Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar">
    <div class="brand">Focus<span>Forge</span></div>
    <div class="nav-links">
        <a th:href="@{/focusforge/dashboard}">Dashboard</a>
        <a th:href="@{/focusforge/tasks}">Tasks</a>
        <a th:href="@{/focusforge/tasks/add}">Add Task</a>
        <a th:href="@{/focusforge/check-in}">Smart Check-in</a>
    </div>
</nav>

<main class="page">
    <div class="form-card">
        <h1 th:text="${name}">Add Study Task</h1>
        <p style="text-align:center;color:#64748b">Add task details so FocusForge can make a better recommendation.</p>

        <form method="post"
              th:action="${editMode} ? @{/focusforge/tasks/edit/{id}(id=${originalTaskId})} : @{/focusforge/tasks/add}"
              th:object="${task}">

            <div class="form-grid">
                <div class="field">
                    <label>Task ID</label>
                    <input type="number" th:field="*{taskId}" th:readonly="${editMode}" placeholder="Example: 101">
                    <span class="error" th:errors="*{taskId}"></span>
                </div>

                <div class="field">
                    <label>Course Name</label>
                    <input type="text" th:field="*{courseName}" placeholder="Example: Database Systems">
                    <span class="error" th:errors="*{courseName}"></span>
                </div>

                <div class="field full">
                    <label>Task Name</label>
                    <input type="text" th:field="*{taskName}" placeholder="Example: Complete normalization assignment">
                    <span class="error" th:errors="*{taskName}"></span>
                </div>

                <div class="field">
                    <label>Deadline</label>
                    <input type="date" th:field="*{deadline}">
                    <span class="error" th:errors="*{deadline}"></span>
                </div>

                <div class="field">
                    <label>Estimated Minutes</label>
                    <input type="number" th:field="*{estimatedMinutes}" placeholder="Example: 45">
                    <span class="error" th:errors="*{estimatedMinutes}"></span>
                </div>

                <div class="field">
                    <label>Difficulty</label>
                    <select th:field="*{difficulty}">
                        <option value="">Select difficulty</option>
                        <option th:each="item : ${difficulties}" th:value="${item}" th:text="${item}"></option>
                    </select>
                    <span class="error" th:errors="*{difficulty}"></span>
                </div>

                <div class="field">
                    <label>Importance</label>
                    <select th:field="*{importance}">
                        <option value="">Select importance</option>
                        <option th:each="item : ${importanceLevels}" th:value="${item}" th:text="${item}"></option>
                    </select>
                    <span class="error" th:errors="*{importance}"></span>
                </div>

                <div class="field full">
                    <label>Status</label>
                    <select th:field="*{status}">
                        <option th:each="item : ${statuses}" th:value="${item}" th:text="${item}"></option>
                    </select>
                    <span class="error" th:errors="*{status}"></span>
                </div>

                <div class="field full">
                    <label>Description</label>
                    <textarea rows="4" th:field="*{description}" placeholder="Write a short note about the task"></textarea>
                    <span class="error" th:errors="*{description}"></span>
                </div>
            </div>

            <div class="actions" style="margin-top:20px">
                <button class="btn btn-primary" type="submit" th:text="${editMode} ? 'Update Task' : 'Add Task'">Add Task</button>
                <a class="btn btn-muted" th:href="@{/focusforge/tasks}">Back to List</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
