<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>All Study Tasks</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><nav class="navbar"><div class="brand">🎓 Focus<span>Forge</span></div><div class="nav-links"><a th:href="@{/focusforge/dashboard}">Dashboard</a><a th:href="@{/focusforge/tasks}">Tasks</a><a th:href="@{/focusforge/check-in}">Check-in</a><a th:href="@{/focusforge/history}">History</a></div><div class="tagline">Focus Smarter, Achieve More!</div></nav><main class="page"><div class="toolbar"><div><h1>All Study Tasks</h1><p class="muted">View, manage and track all your study tasks.</p></div><a class="btn btn-blue" th:href="@{/focusforge/tasks/add}">+ Add New Task</a></div><form method="get" th:action="@{/focusforge/tasks}" class="filter-form"><div class="field"><label>Search</label><input type="text" name="keyword" th:value="${keyword}" placeholder="Search task or course"></div><div class="field"><label>Status</label><select name="status"><option value="">All Status</option><option th:each="item : ${statuses}" th:value="${item}" th:text="${item}" th:selected="${item == selectedStatus}"></option></select></div><div class="field"><label>Difficulty</label><select name="difficulty"><option value="">All Difficulty</option><option th:each="item : ${difficulties}" th:value="${item}" th:text="${item}" th:selected="${item == selectedDifficulty}"></option></select></div><div class="field"><label>Importance</label><select name="importance"><option value="">All Importance</option><option th:each="item : ${importanceLevels}" th:value="${item}" th:text="${item}" th:selected="${item == selectedImportance}"></option></select></div><button class="btn btn-blue" type="submit">Search</button><a class="btn btn-gray" th:href="@{/focusforge/tasks}">Clear</a></form><div class="table-card section-gap"><div class="empty" th:if="${tasks.isEmpty()}">No matching tasks found.</div><div class="table-wrapper" th:unless="${tasks.isEmpty()}"><table><thead><tr><th>ID</th><th>Task Name</th><th>Course</th><th>Deadline</th><th>Time</th><th>Difficulty</th><th>Importance</th><th>Status</th><th>Action</th></tr></thead><tbody><tr th:each="task : ${tasks}"><td th:text="${task.taskId}"></td><td><b th:text="${task.taskName}"></b></td><td th:text="${task.courseName}"></td><td><span class="badge" th:classappend="${' ' + task.deadlineBadgeClass}" th:text="${task.deadlineLabel}"></span></td><td th:text="${task.estimatedMinutes + ' min'}"></td><td><span class="badge" th:classappend="${task.difficulty == 'Hard' ? ' badge-hard' : (task.difficulty == 'Medium' ? ' badge-medium' : ' badge-easy')}" th:text="${task.difficulty}"></span></td><td><span class="badge" th:classappend="${task.importance == 'High' ? ' badge-high' : (task.importance == 'Medium' ? ' badge-medium' : ' badge-low')}" th:text="${task.importance}"></span></td><td><span class="badge" th:classappend="${task.status == 'Completed' ? ' badge-completed' : (task.status == 'In Progress' ? ' badge-progress' : (task.status == 'Pending' ? ' badge-pending' : ' badge-skipped'))}" th:text="${task.status}"></span></td><td><div class="action-row"><a class="btn btn-green" th:href="@{/focusforge/tasks/edit/{id}(id=${task.taskId})}">Edit</a><a class="btn btn-blue" th:if="${task.status == 'Pending'}" th:href="@{/focusforge/tasks/status/{id}(id=${task.taskId},value='In Progress')}">Start</a><a class="btn btn-green" th:if="${task.status != 'Completed'}" th:href="@{/focusforge/tasks/status/{id}(id=${task.taskId},value='Completed')}">Done</a><a class="btn btn-gray" th:if="${task.status == 'Completed'}" th:href="@{/focusforge/tasks/status/{id}(id=${task.taskId},value='Pending')}">Reopen</a><a class="btn btn-red" th:href="@{/focusforge/tasks/delete/{id}(id=${task.taskId})}" onclick="return confirm('Delete this task?')">Delete</a></div></td></tr></tbody></table></div></div></main></body></html>
