```html
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Weather List</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f1f5f9;
      margin: 0;
    }

    .container {
      width: 90%;
      max-width: 950px;
      margin: 40px auto;
      padding: 25px;
      background-color: white;
      border: 1px solid #dddddd;
      border-radius: 8px;
    }

    h1 {
      text-align: center;
      color: #1e3a5f;
    }

    .add-button {
      display: inline-block;
      padding: 9px 15px;
      background-color: #16a34a;
      color: white;
      text-decoration: none;
      border-radius: 4px;
    }

    .add-button:hover {
      background-color: #15803d;
    }

    .search-form {
      padding: 15px;
      background-color: #f8fafc;
      border: 1px solid #dddddd;
      border-radius: 5px;
    }

    label {
      font-weight: bold;
      margin-right: 5px;
    }

    input {
      padding: 8px;
      margin-right: 10px;
      border: 1px solid #bbbbbb;
      border-radius: 4px;
    }

    input:focus {
      outline: none;
      border-color: #2563eb;
    }

    button {
      padding: 9px 15px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #1d4ed8;
    }

    .clear-button {
      display: inline-block;
      padding: 8px 15px;
      background-color: #64748b;
      color: white;
      text-decoration: none;
      border-radius: 4px;
    }

    .clear-button:hover {
      background-color: #475569;
    }

    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
    }

    th {
      padding: 11px;
      border: 1px solid #cccccc;
      text-align: center;
    }

    table tr:first-child {
      background-color: #2563eb;
      color: white;
    }

    table tr:not(:first-child):hover {
      background-color: #f1f5f9;
    }

    .edit-button {
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

    .delete-button {
      color: #dc2626;
      text-decoration: none;
      font-weight: bold;
    }

    .edit-button:hover,
    .delete-button:hover {
      text-decoration: underline;
    }

    .empty-message {
      padding: 15px;
      margin-top: 20px;
      text-align: center;
      background-color: #fff7ed;
      border: 1px solid #fed7aa;
      border-radius: 4px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Weather Update</h1>

  <a href="/weather/add"
     class="add-button">
    + Add Weather
  </a>

  <br><br>

  <form method="get"
        th:action="@{/weather/list}"
        class="search-form">

    <label>Search</label>

    <input type="text"
           name="keyword"
           th:value="${keyword}"
           placeholder="Search by day">

    <label>Moisture</label>

    <input type="text"
           name="moisture"
           th:value="${moisture}"
           placeholder="Filter by moisture">

    <button type="submit">
      Search
    </button>

    <a th:href="@{/weather/list}"
       class="clear-button">
      Clear
    </a>

  </form>

  <p th:if="${weathers.isEmpty()}"
     class="empty-message">
    No Weather Available
  </p>

  <table border="1"
         th:unless="${weathers.isEmpty()}">

    <tr>
      <th>Day</th>
      <th>Moisture</th>
      <th>Temperature</th>
      <th>UV Index</th>
      <th>Wind</th>
      <th>Action</th>
    </tr>

    <tr th:each="weather : ${weathers}">

      <th th:text="${weather.day}">Sunday</th>
      <th th:text="${weather.moisture}">70</th>
      <th th:text="${weather.temperature}">30.5</th>
      <th th:text="${weather.uvIndex}">5.5</th>
      <th th:text="${weather.wind}">20</th>

      <th>
        <a th:href="@{'/weather/edit/' + ${weather.day}}"
           class="edit-button"
           style="padding-right: 10px">
          Edit
        </a>

        <a th:href="@{'/weather/delete/' + ${weather.day}}"
           class="delete-button"
           onclick="return confirm('Are you sure you want to delete this weather information?')">
          Delete
        </a>
      </th>

    </tr>

  </table>

</div>

</body>
</html>
