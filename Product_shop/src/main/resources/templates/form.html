<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Product Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            color: #222222;
        }

        .container {
            width: 90%;
            max-width: 500px;
            margin: 50px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
        }

        label {
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #cccccc;
            border-radius: 5px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        input[readonly] {
            background-color: #eeeeee;
        }

        span {
            display: inline-block;
            margin-top: 5px;
            font-size: 13px;
        }

        button {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 5px;
            background-color: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        .back-link {
            display: block;
            text-align: center;
            color: #2563eb;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="container">

    <h1 th:text="${name}">Product Form</h1>

    <form method="post"
          th:action="${editMode}
          ? @{/product/edit/{id}(id=${originalId})}
          : @{/product/add}"
          th:object="${product}">

        <label>Product ID</label><br>

        <input type="number"
               th:field="*{id}"
               th:readonly="${editMode}">

        <span th:errors="*{id}" style="color: red"></span>
        <br><br>

        <label>Product name</label><br>

        <input type="text" th:field="*{name}">

        <span th:errors="*{name}" style="color: red"></span>
        <br><br>

        <label>Product category</label><br>

        <input type="text" th:field="*{category}">

        <span th:errors="*{category}" style="color: red"></span>
        <br><br>

        <label>Stock</label><br>

        <input type="number" th:field="*{stock}">

        <span th:errors="*{stock}" style="color: red"></span>
        <br><br>

        <label>Price</label><br>

        <input type="number"
               step="0.1"
               th:field="*{price}">

        <span th:errors="*{price}" style="color: red"></span>
        <br><br>

        <button type="submit"
                th:text="${editMode} ? 'Update Product' : 'Add Product'">
            Add Product
        </button>

        <br><br>

        <a class="back-link"
           th:href="@{/product/list}">
            Back to list
        </a>

    </form>

</div>

</body>
</html>
