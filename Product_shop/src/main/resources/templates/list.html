<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Product List</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            color: #222222;
        }

        .container {
            width: 92%;
            max-width: 1000px;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        .add-button {
            display: inline-block;
            padding: 10px 16px;
            background-color: #16a34a;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .add-button:hover {
            background-color: #15803d;
        }

        .search-form {
            display: flex;
            gap: 10px;
            align-items: end;
            flex-wrap: wrap;
            padding: 18px;
            background-color: #f8fafc;
            border-radius: 8px;
        }

        .input-group {
            flex: 1;
            min-width: 200px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 5px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            background-color: #2563eb;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        .clear-button {
            display: inline-block;
            padding: 10px 18px;
            background-color: #64748b;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .clear-button:hover {
            background-color: #475569;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        table,
        th {
            border: 1px solid #dddddd;
        }

        th {
            padding: 12px;
            text-align: center;
        }

        tr:first-child {
            background-color: #2563eb;
            color: white;
        }

        tr:not(:first-child):hover {
            background-color: #f1f5f9;
        }

        .edit-button {
            color: #2563eb;
            font-weight: bold;
            text-decoration: none;
        }

        .delete-button {
            color: #dc2626;
            font-weight: bold;
            text-decoration: none;
        }

        .edit-button:hover,
        .delete-button:hover {
            text-decoration: underline;
        }

        .empty-message {
            padding: 20px;
            margin-top: 20px;
            text-align: center;
            background-color: #fff7ed;
            border: 1px solid #fed7aa;
            border-radius: 6px;
        }

        @media screen and (max-width: 600px) {
            .search-form {
                display: block;
            }

            .input-group {
                margin-bottom: 12px;
            }

            button,
            .clear-button {
                width: 100%;
                margin-bottom: 8px;
                text-align: center;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Product List</h1>

    <a href="/product/add"
       class="add-button">
        + Add Product
    </a>

    <br><br>

    <form method="get"
          th:action="@{/product/list}"
          class="search-form">

        <div class="input-group">

            <label>Search</label>

            <input type="text"
                   name="keyword"
                   th:value="${keyword}"
                   placeholder="Search by ID or name">

        </div>

        <div class="input-group">

            <label>Category</label>

            <input type="text"
                   name="category"
                   th:value="${category}"
                   placeholder="Filter by category">

        </div>

        <button type="submit">
            Search
        </button>

        <a th:href="@{/product/list}"
           class="clear-button">
            Clear
        </a>

    </form>

    <p th:if="${products.isEmpty()}"
       class="empty-message">
        No Products Available
    </p>

    <div class="table-wrapper">

        <table border="1"
               th:unless="${products.isEmpty()}">

            <tr>
                <th>Id</th>
                <th>Name</th>
                <th>Category</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Action</th>
            </tr>

            <tr th:each="product : ${products}">

                <th th:text="${product.id}">1</th>
                <th th:text="${product.name}">Shirt</th>
                <th th:text="${product.category}">Men</th>
                <th th:text="${product.price}">999.99</th>
                <th th:text="${product.stock}">50</th>

                <th>
                    <a th:href="@{'/product/edit/' + ${product.id}}"
                       class="edit-button"
                       style="padding-right: 10px">
                        Edit
                    </a>

                    <a th:href="@{'/product/delete/' + ${product.id}}"
                       class="delete-button"
                       onclick="return confirm('Are you sure you want to delete this product?')">
                        Delete
                    </a>
                </th>

            </tr>

        </table>

    </div>

</div>

</body>
</html>
