name: FocusForge CI

on:
  push:
    branches: [main]
    paths:
      - 'FocusForge/**'
      - '.github/workflows/focusforge-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'FocusForge/**'
      - '.github/workflows/focusforge-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FocusForge

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: FocusForge/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build FocusForge
        run: ./mvnw --batch-mode --update-snapshots clean test
