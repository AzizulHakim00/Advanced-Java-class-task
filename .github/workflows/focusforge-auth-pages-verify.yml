name: FocusForge Auth Pages Verify

on:
  push:
    branches:
      - agent/focusforge-simple-auth-features

jobs:
  verify-pages:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: focusforge_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Start FocusForge
        working-directory: FocusForge
        run: |
          chmod +x mvnw
          ./mvnw spring-boot:run > /tmp/focusforge.log 2>&1 &
          echo $! > /tmp/focusforge.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8080/sign-in >/tmp/sign-in.html; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/focusforge.log
          exit 1
      - name: Verify authentication pages
        run: |
          curl -fsS http://127.0.0.1:8080/sign-in | grep -q "Sign In"
          curl -fsS http://127.0.0.1:8080/sign-up | grep -q "Sign Up"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)" = "302"
          test "$(curl -s -o /dev/null -w '%{redirect_url}' http://127.0.0.1:8080/)" = "http://127.0.0.1:8080/sign-in"
