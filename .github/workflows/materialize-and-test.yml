name: Materialize and test Maze Bank

on:
  push:
    branches:
      - agent/maze-bank-complete
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Recreate source tree
        run: bash rebuild-project.sh
      - name: Run tests
        working-directory: Maze-Bank-Management-System
        run: mvn --batch-mode clean test
      - name: Commit materialized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Maze-Bank-Management-System
          if git diff --cached --quiet; then
            echo "Source is already materialized."
          else
            git commit -m "Materialize completed Maze Bank source"
            git push
          fi
